<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="350" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827">Bridged Networking</text>

  <!-- Router -->
  <rect x="280" y="60" width="140" height="50" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="350" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#78350f">Physical Router</text>

  <!-- LAN line -->
  <line x1="350" y1="110" x2="350" y2="150" stroke="#9ca3af" stroke-width="3"/>
  <line x1="120" y1="150" x2="580" y2="150" stroke="#9ca3af" stroke-width="3"/>
  <text x="350" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Local Network (LAN)</text>

  <!-- Host machine -->
  <rect x="100" y="190" width="150" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="175" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151">Host Machine</text>
  <text x="175" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">192.168.1.10</text>

  <!-- VM box, appears as peer on LAN -->
  <rect x="480" y="190" width="150" height="70" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="555" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#14532d">Virtual Machine</text>
  <text x="555" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">192.168.1.25</text>

  <!-- connectors -->
  <line x1="175" y1="190" x2="175" y2="150" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="555" y1="190" x2="555" y2="150" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="350" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">VM gets its own IP on the LAN — acts like a separate physical device</text>
</svg>
