<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="350" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827">NAT Networking</text>

  <!-- Internet cloud -->
  <ellipse cx="590" cy="80" rx="90" ry="45" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="590" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">Internet</text>

  <!-- Host machine box -->
  <rect x="40" y="120" width="560" height="180" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="60" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Host Machine</text>

  <!-- Host network adapter -->
  <rect x="440" y="160" width="120" height="40" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="500" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#78350f">Host Network</text>

  <!-- NAT engine -->
  <rect x="260" y="160" width="140" height="40" rx="6" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
  <text x="330" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e1b4b">NAT Engine</text>

  <!-- VM box -->
  <rect x="70" y="220" width="150" height="60" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="145" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#14532d">Virtual Machine</text>
  <text x="145" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">10.0.2.15</text>

  <!-- Arrows -->
  <line x1="220" y1="250" x2="260" y2="185" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="180" x2="440" y2="180" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="160" x2="560" y2="105" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="330" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">VM shares the host's IP; outside world only sees the host, not the VM</text>
</svg>
