<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="350" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827">Host-Only Networking</text>

  <!-- Internet cloud, crossed out -->
  <ellipse cx="590" cy="70" rx="80" ry="40" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="590" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f1d1d">Internet</text>
  <line x1="530" y1="30" x2="650" y2="110" stroke="#ef4444" stroke-width="3"/>

  <!-- Isolated network box -->
  <rect x="60" y="130" width="500" height="160" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="80" y="155" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4c1d95">Isolated Host-Only Network</text>

  <!-- Host machine -->
  <rect x="90" y="190" width="150" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="165" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151">Host Machine</text>
  <text x="165" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">192.168.56.1</text>

  <!-- VM box -->
  <rect x="400" y="190" width="150" height="70" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="475" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#14532d">Virtual Machine</text>
  <text x="475" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">192.168.56.10</text>

  <!-- connecting arrow between host and VM -->
  <line x1="240" y1="225" x2="400" y2="225" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="400" y1="225" x2="240" y2="225" stroke="#4b5563" stroke-width="0" marker-end="url(#arrow3)"/>

  <text x="350" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Host and VM can talk to each other, but neither reaches the outside world</text>
</svg>
